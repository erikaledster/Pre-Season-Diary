<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f174f">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>Rugby Performance Diary</title><style>
:root{--bg:#fdf7fa;--card:#fff;--text:#2a1821;--muted:#735c67;--line:#ead7df;--accent:#8f174f;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:90px}
header{background:#8f174f;color:#fff;padding:18px 18px 20px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
nav{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:73px;z-index:9}
nav button{border:0;background:#eef2f7;border-radius:10px;padding:9px 13px;font-weight:700;white-space:nowrap;color:#374151}nav button.active{background:var(--accent);color:#fff}
main{max-width:760px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px #00000008}
h2{font-size:19px;margin:3px 0 12px}h3{font-size:15px;margin:0 0 9px}.muted{color:var(--muted);font-size:13px}
.exercise{border-top:1px solid var(--line);padding:13px 0}.exercise:first-of-type{border-top:0}.row{display:flex;align-items:center;gap:10px}.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}.ename{font-weight:700;flex:1}.dose{font-size:13px;color:var(--muted);margin-top:4px;margin-left:32px}
.inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 0 32px}.inputs label,.metric label{font-size:11px;color:var(--muted);display:block}.inputs input,.metric input,.notes,.select{width:100%;margin-top:3px;border:1px solid #d1d5db;border-radius:9px;padding:9px;background:#fff;font-size:16px}
button.primary{width:100%;border:0;border-radius:11px;padding:12px;background:var(--accent);color:white;font-weight:800;font-size:15px}.smallbtn{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:#f8fafc;border-radius:11px;padding:9px}.metric input{margin-top:5px}.sliderMetric input[type=range]{width:100%;accent-color:var(--accent);padding:0}.sliderHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.sliderHead b{font-size:13px;color:var(--text)}
.bar{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);width:0}
.notice{padding:12px;border-radius:12px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:12px}.warning{background:#fff7ed;color:#9a3412}.good{background:#ecfdf3;color:#166534}.danger{background:#fef2f2;color:#991b1b}
.tag{display:inline-block;padding:4px 7px;border-radius:8px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:12px}.stat b{font-size:22px}.stat small{color:var(--muted)}
.progressrow{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}.progressrow span{font-size:12px;color:var(--muted)}
canvas{width:100%;height:190px;border:1px solid var(--line);border-radius:12px;background:#fff}.checklist{padding-left:20px}.checklist li{margin:8px 0}
.timer{font-size:42px;text-align:center;font-variant-numeric:tabular-nums;margin:10px}.timerBtns{display:flex;gap:8px}.timerBtns button{flex:1}
.footer{font-size:11px;color:var(--muted);text-align:center;padding:15px}.hidden{display:none}.weekTabs{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.weekTabs button{border:0;background:#eef2f7;border-radius:10px;padding:9px 12px;font-weight:800;white-space:nowrap;color:#374151}.weekTabs button.active{background:var(--accent);color:#fff}.weekTimer{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
@media(min-width:600px){.metrics{grid-template-columns:repeat(5,1fr)}.inputs{grid-template-columns:repeat(5,1fr)}}

.runBlock{margin:12px 0;border:1px solid rgba(128,0,64,.14);border-radius:12px;overflow:hidden;background:#fff7fb}.runBlockTitle{font-weight:800;font-size:.78rem;letter-spacing:.06em;padding:9px 12px;background:#f4d7e5;color:#7d174b}.runBlockText{padding:11px 12px;line-height:1.5;color:#3f2733}.runBlock+.runBlock{margin-top:10px}

header{padding-top:calc(18px + env(safe-area-inset-top));}
nav{top:calc(73px + env(safe-area-inset-top));}
.sessionChoice{display:flex;gap:7px;overflow:auto;padding-bottom:4px}
.sessionChoice button{border:0;background:#eef2f7;border-radius:10px;padding:9px 12px;font-weight:800;white-space:nowrap;color:#374151}
.sessionChoice button.active{background:var(--accent);color:#fff}
.checkReveal{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#f8fafc}
.bodyrow{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:9px}
.otherrow{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-top:8px}
.rangeFull{width:100%;accent-color:var(--accent)}
@media(min-width:600px){.bodyrow{grid-template-columns:1fr 1fr}}

.subtabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.subtabs button{border:0;background:#eef2f7;border-radius:10px;padding:9px 12px;font-weight:800;white-space:nowrap;color:#374151}.subtabs button.active{background:var(--accent);color:#fff}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sectionTitle{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.setrow{display:grid;grid-template-columns:28px 1fr 82px 70px;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:7px}.setrow input[type=checkbox]{width:21px;height:21px;accent-color:var(--accent)}.setrow input[type=number]{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:7px;font-size:14px}
.nextgame{background:#fff7fb;border:2px solid #f0cfde}.roundMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.roundMeta>div{background:#f8fafc;border-radius:11px;padding:10px}
details summary{cursor:pointer}.saveNote{font-size:11px;color:var(--muted);margin-top:6px}.dayTabs{display:flex;gap:7px;overflow:auto;padding:6px 0}.dayTabs button{border:0;background:#eef2f7;border-radius:10px;padding:8px 10px;font-weight:800;white-space:nowrap}.dayTabs button.active{background:var(--accent);color:#fff}
@media(max-width:520px){.inline2,.roundMeta{grid-template-columns:1fr}.setrow{grid-template-columns:28px 1fr 72px 62px}}
</style></head><body>
<header><h1>Rugby Performance Diary</h1><p>Goals → training → games → gym</p></header><nav id="nav"></nav><main id="app"></main>
<div class="footer">Rugby Performance Diary · stored on this device</div>
<script>
const KEY="rugbyPerformanceDiaryV1";
const old=JSON.parse(localStorage.getItem("preSeasonDiaryV3")||"null");
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{goals:{},preseason:{},inseason:{},games:{},gym:{},prs:{},preseasonReview:""};
if(old&&!localStorage.getItem(KEY)){
  (old.sessions||[]).forEach(s=>{let w=s.week||1;state.preseason[w]=state.preseason[w]||{sessions:[]};state.preseason[w].sessions.push({date:s.date||"",type:s.type||"Team training",pre:{},post:s})});
  state.prs=old.prs||{}; save();
}
let page=localStorage.getItem("rpdPage")||"dashboard", preWeek=+(localStorage.getItem("rpdPreWeek")||1), inWeek=+(localStorage.getItem("rpdInWeek")||1), gameRound=+(localStorage.getItem("rpdRound")||1), gymWeek=+(localStorage.getItem("rpdGymWeek")||1), gymDay=+(localStorage.getItem("rpdGymDay")||0);
const $=s=>document.querySelector(s), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function v(id){return document.getElementById(id)?.value??""} function n(id){return Number(v(id))||0}
function setPage(p){page=p;localStorage.setItem("rpdPage",p);render()}
function nav(){let t=[["dashboard","Dashboard"],["goals","Goal Setting"],["preseason","Preseason"],["inseason","InSeason Training"],["gameday","GameDay"],["gym","Gym"]];$("#nav").innerHTML=t.map(x=>`<button class="${page===x[0]?'active':''}" onclick="setPage('${x[0]}')">${x[1]}</button>`).join("")}
function slider(label,id,value=5,min=0){return `<div class="metric sliderMetric"><div class="sliderHead"><label>${label}</label><b id="${id}o">${value}/10</b></div><input id="${id}" type="range" min="${min}" max="10" step="1" value="${value}" oninput="${id}o.textContent=this.value+'/10'"></div>`}
function weeks(fn,current,count=12,prefix="Week"){return `<div class="weekTabs">${Array.from({length:count},(_,i)=>i+1).map(x=>`<button class="${x===current?'active':''}" onclick="${fn}(${x})">${prefix} ${x}</button>`).join("")}</div>`}
function ensure(kind,w){state[kind][w]=state[kind][w]||{sessions:[]};return state[kind][w]}
function nextGame(){return Object.keys(state.games).map(Number).sort((a,b)=>a-b).map(r=>({round:r,...state.games[r]})).find(g=>g.date&&g.date>=today())}
function dashboard(){let g=nextGame(), ps=Object.values(state.preseason).reduce((a,w)=>a+(w.sessions?.length||0),0), ins=Object.values(state.inseason).reduce((a,w)=>a+(w.sessions?.length||0),0);return `
<section class="card"><h2>Dashboard</h2><div class="grid2"><div class="stat"><small>Preseason sessions</small><br><b>${ps}</b></div><div class="stat"><small>In-season sessions</small><br><b>${ins}</b></div><div class="stat"><small>Games reviewed</small><br><b>${Object.values(state.games).filter(x=>x.post).length}</b></div><div class="stat"><small>Gym PRs</small><br><b>${Object.keys(state.prs).filter(x=>state.prs[x]?.weight).length}</b></div></div></section>
<section class="card nextgame"><div class="row"><div style="flex:1"><h2>Next Game</h2><div class="muted">${g?`Round ${g.round}`:"Waiting for official draw"}</div></div><span class="tag">GAME DAY</span></div>${g?`<h2>vs ${esc(g.vs||"TBC")}</h2><div class="roundMeta"><div><small>Date</small><br><b>${esc(g.date)}</b></div><div><small>Time</small><br><b>${esc(g.time||"TBC")}</b></div><div><small>Venue</small><br><b>${esc(g.venue||"TBC")}</b></div><div><small>Round</small><br><b>${g.round}</b></div></div><button class="primary" style="margin-top:10px" onclick="gameRound=${g.round};setPage('gameday')">Open GameDay</button>`:`<p class="muted">Once your draw is entered in GameDay, the next fixture will automatically appear here.</p>`}</section>
<section class="card"><h3>Current Focus</h3><p>${esc(state.goals.current||"No current focus added yet.")}</p><button class="smallbtn" onclick="setPage('goals')">Goal Setting</button></section>`}
function goals(){return `<section class="card"><h2>Goal Setting</h2><p class="muted">A simple starting layout. We can reshape this after you've used it.</p></section><section class="card"><h3>Season Goals</h3><textarea class="notes" id="gSeason" rows="4" placeholder="What do you want to achieve this season?">${esc(state.goals.season||"")}</textarea><h3 class="sectionTitle">Current Focus</h3><textarea class="notes" id="gCurrent" rows="3" placeholder="What are you focusing on right now?">${esc(state.goals.current||"")}</textarea><h3 class="sectionTitle">Personal Targets</h3><textarea class="notes" id="gTargets" rows="4" placeholder="Skills, fitness, selection, game management...">${esc(state.goals.targets||"")}</textarea><button class="primary" style="margin-top:10px" onclick="state.goals={season:v('gSeason'),current:v('gCurrent'),targets:v('gTargets')};save();render()">Save Goals</button></section>`}
function setPre(w){preWeek=w;localStorage.setItem("rpdPreWeek",w);render()} function setPreReview(){preWeek=13;localStorage.setItem("rpdPreWeek",13);render()} function setIn(w){inWeek=w;localStorage.setItem("rpdInWeek",w);render()}
function training(kind,w){let pre=kind==="preseason";if(pre&&w===13)return `<section class="card"><h2>Preseason</h2><div class="weekTabs">${Array.from({length:12},(_,i)=>i+1).map(x=>`<button onclick="setPre(${x})">Week ${x}</button>`).join("")}<button class="active">Preseason Review</button></div></section><section class="card"><h2>Preseason Review</h2><p class="muted">Overall review of the full preseason block.</p><textarea class="notes" rows="6" placeholder="Overall preseason reflections, progress, biggest improvements, areas to carry into the season..." onchange="state.preseasonReview=this.value;save()">${esc(state.preseasonReview)}</textarea></section>`;
let wk=ensure(kind,w);let selector=pre?`<div class="weekTabs">${Array.from({length:12},(_,i)=>i+1).map(x=>`<button class="${x===w?'active':''}" onclick="setPre(${x})">Week ${x}</button>`).join("")}<button onclick="setPreReview()">Preseason Review</button></div>`:weeks("setIn",w);
return `<section class="card"><h2>${pre?"Preseason":"InSeason Training"}</h2>${selector}</section><section class="card"><div class="row"><div style="flex:1"><h2>Week ${w}</h2><div class="muted">${wk.sessions.length} session${wk.sessions.length===1?"":"s"}</div></div><span class="tag">${pre?"PRESEASON":"IN SEASON"}</span></div><button class="primary" onclick="addSession('${kind}',${w})">＋ Add Session</button></section>${wk.sessions.map((s,i)=>sessionCard(kind,w,i,s)).join("")||`<section class="card"><p class="muted">No sessions added yet.</p></section>`}${weekReview(kind,w)}`}
function addSession(k,w){ensure(k,w).sessions.push({date:today(),type:"Team Training",pre:{body:5,energy:5,mindset:5,workons:""},post:{duration:60,rpe:5,fitness:5,during:5,after:5,readiness:5}});save();render()}
function sessionCard(k,w,i,s){let p=s.pre||{},q=s.post||{};return `<section class="card"><div class="row"><div style="flex:1"><h2>Session ${i+1}</h2></div><button class="smallbtn" onclick="deleteSession('${k}',${w},${i})">Delete Session</button></div>
<div class="inline2"><div class="metric"><label>Date</label><input id="sd_${k}_${w}_${i}" type="date" value="${esc(s.date||today())}" onchange="saveSessionHeader('${k}',${w},${i})"></div><div class="metric"><label>Session type</label><input id="st_${k}_${w}_${i}" value="${esc(s.type||"Team Training")}" onchange="saveSessionHeader('${k}',${w},${i})"></div></div>
<div class="metric sliderMetric" style="margin-top:8px"><div class="sliderHead"><label>Duration</label><b id="du_${k}_${w}_${i}o">${q.duration??60} min</b></div><input id="du_${k}_${w}_${i}" type="range" min="15" max="180" step="5" value="${q.duration??60}" oninput="document.getElementById('du_${k}_${w}_${i}o').textContent=this.value+' min'" onchange="saveSessionHeader('${k}',${w},${i})"></div>
<details open><summary style="margin-top:14px"><b>Pre-Session</b></summary><div class="metrics" style="margin-top:10px">${slider("How is your body feeling?",`pb_${k}_${w}_${i}`,p.body??5)}${slider("Energy / fatigue",`pe_${k}_${w}_${i}`,p.energy??5)}${slider("Mindset going into training",`pm_${k}_${w}_${i}`,p.mindset??5)}</div><label>Personal work-ons</label><textarea class="notes" id="pw_${k}_${w}_${i}" rows="3" placeholder="What do you want to work on personally, before knowing the session?">${esc(p.workons||"")}</textarea><button class="smallbtn" style="margin-top:8px" onclick="savePre('${k}',${w},${i})">Save Pre-Session</button></details>
<details><summary style="margin-top:14px"><b>After Session</b></summary><label style="margin-top:10px">What were the main focuses of this session?</label><textarea class="notes" id="sf_${k}_${w}_${i}" rows="3">${esc(q.focus||"")}</textarea><div class="metrics">${slider("Overall RPE",`sr_${k}_${w}_${i}`,q.rpe??5)}${slider("Fitness / conditioning",`sc_${k}_${w}_${i}`,q.fitness??5)}${slider("During training",`sdu_${k}_${w}_${i}`,q.during??5)}${slider("After training",`sa_${k}_${w}_${i}`,q.after??5)}${k==="inseason"?slider("Game Readiness",`sgr_${k}_${w}_${i}`,q.readiness??5):""}</div>
<h3 class="sectionTitle">Body Check</h3><div class="metrics">${["Overall","Knee","Shoulder","Calf","Achilles","Ankle"].map(a=>slider(a,`bc_${a.toLowerCase()}_${k}_${w}_${i}`,q[a.toLowerCase()]??0)).join("")}</div>
<label>Specific drills that worked well or you enjoyed</label><textarea class="notes" id="dr_${k}_${w}_${i}">${esc(q.drills||"")}</textarea><label>What went well?</label><textarea class="notes" id="ww_${k}_${w}_${i}">${esc(q.well||"")}</textarea><label>What was difficult / what needs improving?</label><textarea class="notes" id="im_${k}_${w}_${i}">${esc(q.improve||"")}</textarea><label>Coach feedback</label><textarea class="notes" id="cf_${k}_${w}_${i}">${esc(q.coach||"")}</textarea><button class="primary" style="margin-top:10px" onclick="savePost('${k}',${w},${i})">Save After-Session Review</button></details></section>`}
function saveSessionHeader(k,w,i){let s=ensure(k,w).sessions[i];s.date=v(`sd_${k}_${w}_${i}`);s.type=v(`st_${k}_${w}_${i}`);s.post=s.post||{};s.post.duration=n(`du_${k}_${w}_${i}`);save()}
function deleteSession(k,w,i){if(!confirm("Delete this session? This cannot be undone."))return;ensure(k,w).sessions.splice(i,1);save();render()}
function savePre(k,w,i){let s=ensure(k,w).sessions[i];s.pre={body:n(`pb_${k}_${w}_${i}`),energy:n(`pe_${k}_${w}_${i}`),mindset:n(`pm_${k}_${w}_${i}`),workons:v(`pw_${k}_${w}_${i}`)};save()}
function savePost(k,w,i){let s=ensure(k,w).sessions[i];s.date=v(`sd_${k}_${w}_${i}`);s.type=v(`st_${k}_${w}_${i}`);let q={duration:n(`du_${k}_${w}_${i}`),rpe:n(`sr_${k}_${w}_${i}`),fitness:n(`sc_${k}_${w}_${i}`),during:n(`sdu_${k}_${w}_${i}`),after:n(`sa_${k}_${w}_${i}`),focus:v(`sf_${k}_${w}_${i}`),drills:v(`dr_${k}_${w}_${i}`),well:v(`ww_${k}_${w}_${i}`),improve:v(`im_${k}_${w}_${i}`),coach:v(`cf_${k}_${w}_${i}`)};["overall","knee","shoulder","calf","achilles","ankle"].forEach(a=>q[a]=n(`bc_${a}_${k}_${w}_${i}`));if(k==="inseason")q.readiness=n(`sgr_${k}_${w}_${i}`);q.load=q.duration*q.rpe;s.post=q;save();render()}
function isSunday(){return new Date().getDay()===0}
function weekReview(k,w){if(!isSunday())return `<section class="card"><h3>End-of-Week Review</h3><p class="muted">Your weekly review will appear here on Sunday.</p></section>`;let wk=ensure(k,w), a=wk.sessions.filter(s=>s.post?.load),mins=a.reduce((x,s)=>x+s.post.duration,0),load=a.reduce((x,s)=>x+s.post.load,0),avg=a.length?(a.reduce((x,s)=>x+s.post.rpe,0)/a.length).toFixed(1):"—";return `<section class="card"><h2>Sunday Review</h2><div class="grid2"><div class="stat"><small>Sessions</small><br><b>${a.length}</b></div><div class="stat"><small>Minutes</small><br><b>${mins}</b></div><div class="stat"><small>Training Load</small><br><b>${load}</b></div><div class="stat"><small>Avg RPE</small><br><b>${avg}</b></div></div><label>Weekly reflections</label><textarea class="notes" id="wr_${k}_${w}" rows="4">${esc(wk.review||"")}</textarea><button class="primary" style="margin-top:8px" onclick="ensure('${k}',${w}).review=v('wr_${k}_${w}');save()">Save Weekly Review</button></section>`}
function setRound(r){gameRound=r;localStorage.setItem("rpdRound",r);render()}
function gameday(){let g=state.games[gameRound]||{},p=g.pre||{},q=g.post||{};return `<section class="card"><h2>GameDay</h2><div class="weekTabs">${Array.from({length:12},(_,i)=>i+1).map(r=>`<button class="${r===gameRound?'active':''}" onclick="setRound(${r})">Round ${r}</button>`).join("")}</div></section>
<section class="card"><div class="row"><div style="flex:1"><h2>Round ${gameRound}</h2></div><span class="tag">GAME</span></div><div class="inline2"><div class="metric"><label>Date</label><input id="gd" type="date" value="${esc(g.date||"")}"></div><div class="metric"><label>Vs</label><input id="gv" placeholder="Opponent" value="${esc(g.vs||"")}"></div><div class="metric"><label>Time</label><input id="gt" type="time" value="${esc(g.time||"")}"></div><div class="metric"><label>Venue</label><input id="gve" placeholder="Venue" value="${esc(g.venue||"")}"></div></div><button class="smallbtn" style="margin-top:8px" onclick="saveFixture()">Save Fixture</button></section>
<section class="card"><h2>Pre-Game</h2><div class="metrics">${slider("Readiness Score","gReady",p.readiness??5)}${slider("Energy / fatigue","gEnergy",p.energy??5)}${slider("Training Preparation","gPrep",p.prep??5)}</div><label>Personal Goals</label><textarea class="notes" id="gGoals">${esc(p.goals||"")}</textarea><label>Reminders</label><textarea class="notes" id="gRem">${esc(p.reminders||"")}</textarea><button class="primary" style="margin-top:8px" onclick="savePreGame()">Save Pre-Game</button></section>
<section class="card"><h2>After-Game Review</h2><p class="muted">This is the first layout so you can test what is actually useful after a match.</p><div class="metrics">${slider("Overall Performance","gPerf",q.performance??5)}${slider("Decision-Making","gDec",q.decision??5)}${slider("Execution","gExe",q.execution??5)}${slider("Defence / Effort","gDef",q.defence??5)}</div><label>What went well?</label><textarea class="notes" id="gWell">${esc(q.well||"")}</textarea><label>Key moments / decisions</label><textarea class="notes" id="gMom">${esc(q.moments||"")}</textarea><label>What will I take into next week?</label><textarea class="notes" id="gNext">${esc(q.next||"")}</textarea><label>Coach feedback</label><textarea class="notes" id="gCoach">${esc(q.coach||"")}</textarea><button class="primary" style="margin-top:8px" onclick="savePostGame()">Save Game Review</button></section>`}
function saveFixture(){let g=state.games[gameRound]=state.games[gameRound]||{};Object.assign(g,{date:v("gd"),vs:v("gv"),time:v("gt"),venue:v("gve")});save();render()}
function savePreGame(){let g=state.games[gameRound]=state.games[gameRound]||{};g.pre={readiness:n("gReady"),energy:n("gEnergy"),prep:n("gPrep"),goals:v("gGoals"),reminders:v("gRem")};save()}
function savePostGame(){let g=state.games[gameRound]=state.games[gameRound]||{};g.post={performance:n("gPerf"),decision:n("gDec"),execution:n("gExe"),defence:n("gDef"),well:v("gWell"),moments:v("gMom"),next:v("gNext"),coach:v("gCoach")};save();render()}
const exercises=["Squat","Bench press","Romanian deadlift","Bulgarian split squat","Hip thrust","Calf raise","Leg press","Lat pulldown","Row","Other"], days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function setGymWeek(w){gymWeek=w;gymDay=0;localStorage.setItem("rpdGymWeek",w);render()} function setGymDay(d){gymDay=d;localStorage.setItem("rpdGymDay",d);render()}
function gym(){let phase=gymWeek<=12?"Preseason":"In Season",display=`Week ${gymWeek}`;return `<section class="card"><h2>Gym</h2><div class="subtabs"><button class="active">Weeks</button><button onclick="setPage('prs')">PR Weights</button></div></section><section class="card"><h3>Weeks</h3><div class="weekTabs">${Array.from({length:36},(_,i)=>i+1).map(w=>`<button class="${w===gymWeek?'active':''}" onclick="setGymWeek(${w})">Week ${w}</button>`).join("")}</div></section><section class="card"><div class="row"><div style="flex:1"><h2>${display}</h2><div class="muted">Choose your gym day</div></div><span class="tag">${phase.toUpperCase()}</span></div><div class="dayTabs">${days.map((d,i)=>`<button class="${i===gymDay?'active':''}" onclick="setGymDay(${i})">${d}</button>`).join("")}</div></section>${gymDayCard()}`}
function gymDayCard(){let key=`${gymWeek}-${gymDay}`,data=state.gym[key]||{exercises:{}};return `<section class="card"><div class="row"><div style="flex:1"><h2>${days[gymDay]} Gym Session</h2><div class="muted">Tick each set as you complete it. Enter the weight used beside each individual set.</div></div><span class="pill">${gymWeek<=12?"PRESEASON":"IN SEASON"}</span></div>${exercises.map((e,ei)=>`<div class="exercise"><div class="ename">${e}</div>${[0,1,2,3].map(si=>{let st=data.exercises?.[e]?.[si]||{};return `<div class="setrow"><input id="gc_${ei}_${si}" type="checkbox" ${st.done?"checked":""}><span><b>Set ${si+1}</b></span><input id="gw_${ei}_${si}" type="number" min="0" step=".5" inputmode="decimal" placeholder="kg" value="${st.weight??""}"><input id="gr_${ei}_${si}" type="number" min="0" inputmode="numeric" placeholder="reps" value="${st.reps??""}"></div>`}).join("")}</div>`).join("")}<button class="primary" onclick="saveGym()">Save Gym Session</button></section>`}
function saveGym(){let key=`${gymWeek}-${gymDay}`, ex={};exercises.forEach((e,ei)=>{ex[e]=[];for(let si=0;si<4;si++){let done=$(`#gc_${ei}_${si}`).checked,weight=n(`gw_${ei}_${si}`),reps=n(`gr_${ei}_${si}`);ex[e].push({done,weight,reps});if(done&&weight>(state.prs[e]?.weight||0))state.prs[e]={weight,reps,date:today()}}});state.gym[key]={week:gymWeek,day:gymDay,exercises:ex};save();render()}
function prs(){return `<section class="card"><h2>Gym</h2><div class="subtabs"><button onclick="setPage('gym')">Weeks</button><button class="active">PR Weights</button></div></section><section class="card"><h2>PR Weights</h2><p class="muted">These update automatically when a completed set beats your current highest weight.</p><div class="grid2">${exercises.map(e=>{let p=state.prs[e]||{};return `<div class="metric"><label><b>${e}</b></label><input type="number" step=".5" placeholder="kg" value="${p.weight??""}" onchange="state.prs[${JSON.stringify(e)}]={weight:Number(this.value)||0,date:today()};save()"><div class="saveNote">${p.date?`Updated ${p.date}`:"No PR yet"}</div></div>`}).join("")}</div></section>`}
function render(){nav();let x=page==="dashboard"?dashboard():page==="goals"?goals():page==="preseason"?training("preseason",preWeek):page==="inseason"?training("inseason",inWeek):page==="gameday"?gameday():page==="gym"?gym():prs();$("#app").innerHTML=x}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js?v=9").then(r=>r.update()).catch(()=>{});
</script></body></html>
